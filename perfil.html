<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Perfil — NEXORA</title>

<link rel="stylesheet" href="css/perfil.css">
<link rel="stylesheet" href="css/style.css">

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

</head>


<body class="public-profile-body">


<div class="public-profile">


    <div
        class="public-cover"
        id="publicCover"
    ></div>


    <main class="public-content">


        <div
            class="public-avatar"
            id="publicAvatar"
        >
            A
        </div>


        <div class="verified-line">

            <span id="publicType">
                CREADOR
            </span>

        </div>


        <h1 id="publicName">
            Alex Creator
        </h1>


        <div
            class="public-username"
            id="publicUsername"
        >
            @alexcreator
        </div>


        <p
            class="public-bio"
            id="publicBio"
        >
            Creador de contenido · Gaming · Tecnología
        </p>


        <div class="public-meta">

            <span id="publicCategory">
                ✦ Creador de contenido
            </span>

            <span id="publicLocation">
                ◉ México
            </span>

        </div>


        <div
            id="publicLinks"
            class="public-links"
        ></div>


        <div class="public-footer">

            <div class="public-brand">

                <span class="brand-symbol">
                    N
                </span>

                NEXORA

            </div>

            <small>
                Tu presencia digital, elevada.
            </small>

        </div>


    </main>


</div>


<script src="js/perfil.js"></script>

</body>
</html>
